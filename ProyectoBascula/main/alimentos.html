<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Seleccionar alimento</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --color-principal:#78A17C;
      --color-principal-oscuro:#6a8f6e;
      --color-fondo:#f5f7fa;
      --color-texto:#1f2933;
      --color-borde:#e1e5ee;
    }

    *{
      box-sizing:border-box;
    }

    body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--color-texto);
  background: var(--color-fondo);
  margin:0;
  padding:20px;
  min-height:100vh;
  /* YA NO usamos flex para centrar: */
  display:block;
}


    .MainContainer{
      background:white;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
      width:100%;
      max-width:700px;
      border-radius:16px;
      padding:24px 20px 16px;
      display:flex;
      flex-direction:column;
      max-height: 90vh;
       margin-top:0;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:16px;
    }

    .titulo{
      text-align:left;
    }

    .titulo h2{
      margin:0;
      font-size:1.4rem;
    }

    .titulo p{
      margin:4px 0 0;
      font-size:0.85rem;
      color:#6b7280;
    }

    #BotonAdministrador{
      font-weight: 600;
      border: none;
      background-color: white;
      color: var(--color-principal);
      padding: 8px 14px;
      border-radius: 999px;
      box-shadow:0 0 0 1px var(--color-borde);
      cursor: pointer;
      font-size:0.85rem;
      display:flex;
      align-items:center;
      gap:6px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
      white-space:nowrap;
    }
    #BotonAdministrador:hover{
      background:#f3faf4;
      box-shadow:0 0 0 1px var(--color-principal);
    }

    .filtros{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:10px;
    }

    .buscador input{
      width:100%;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--color-borde);
      font-size:0.95rem;
      outline:none;
    }
    .buscador input:focus{
      border-color:var(--color-principal);
      box-shadow:0 0 0 1px rgba(120,161,124,0.25);
    }

    .categorias{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .chip{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--color-borde);
      font-size:0.8rem;
      cursor:pointer;
      background:white;
      color:#4b5563;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .chip.activo{
      background:var(--color-principal);
      color:white;
      border-color:var(--color-principal);
    }

    /* Contenedor de la lista con scroll */
    #lista{
      margin-top:8px;
      flex:1;
      overflow-y:auto;
      padding-right:4px;
    }

    /* Estilo de cada alimento (botón tipo tarjeta) */
    .btnAlimento{
      width:100%;
      text-align:left;
      padding:10px 12px;
      margin:4px 0;
      background:#ffffff;
      color:var(--color-texto);
      border:1px solid var(--color-borde);
      border-radius:12px;
      box-shadow:0 2px 6px rgba(0,0,0,.04);
      cursor:pointer;
      font-size:0.95rem;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition:background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .btnAlimento:hover{
      background:#f9fafb;
      transform:translateY(-1px);
      border-color:var(--color-principal-oscuro);
      box-shadow:0 4px 10px rgba(0,0,0,.06);
    }

    .alimento-info{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .alimento-nombre{
      font-weight:600;
    }

    .alimento-detalle{
      font-size:0.8rem;
      color:#6b7280;
    }

    .alimento-macro{
      font-size:0.75rem;
      color:#6b7280;
      white-space:nowrap;
      text-align:right;
    }

    @media (max-width:480px){
      .MainContainer{
        padding:18px 14px 12px;
      }
      .titulo h2{
        font-size:1.2rem;
      }
      .alimento-detalle{
        display:none; /* en pantallas muy pequeñas, esconder línea intermedia */
      }
      #esp{
        height: 100px;
      }
    }

  </style>
</head>

<body>
  <div class="MainContainer"> 
    
    <!-- CABECERA -->
    <div class="header">
      <div class="titulo">
        <h2>Selecciona un alimento</h2>
      </div>
      <button onclick="location.href='/LEDsPage'" id="BotonAdministrador">
        ← Regresar
      </button>
    </div>
    <div class="titulo">
      <p>Elige un alimento por 100g para enviar sus datos nutrimentales a la báscula.</p>
    </div>
    <div id="esp"></div>
    <!-- CONTROLES (BUSCADOR + CATEGORÍAS) -->
    <div class="filtros">
      <div class="buscador">
        <input 
          type="text" 
          id="busqueda" 
          placeholder="Buscar alimento (ej. manzana, arroz, queso)...">
      </div>
      <div class="categorias" id="chipsCategorias">
        <!-- Se llenan por JS -->
      </div>
    </div>

    <!-- LISTA DE ALIMENTOS -->
    <div id="lista">
      <!-- Aquí se pintan los botones vía JavaScript -->
    </div>
  </div>

  <script>
    // ====== DATOS DE ALIMENTOS ======
    // g: grasa (g/100g), p: proteína, c: carbohidratos, k: kcal
    // categoria: usada para filtrar visualmente
   
    // ====== ESTADO DE FILTRO ======
    let categoriaActiva = 'Todos';
    let textoBusqueda = '';
    
    const ALIMENTOS = [

  // Frutas
  {nombre: 'Manzana', g:0,  p:0,  c:14, k:52, categoria:'Frutas'},
  {nombre: 'Plátano', g:0,  p:1,  c:23, k:96, categoria:'Frutas'},
  {nombre: 'Fresa', g:0,  p:0,  c:8,  k:32, categoria:'Frutas'},
  {nombre: 'Naranja', g:0, p:1,  c:12, k:47, categoria:'Frutas'},
  {nombre: 'Pera', g:0,  p:0,  c:15, k:57, categoria:'Frutas'},

  // Cereales y panes
  {nombre: 'Arroz cocido', g:1, p:3,  c:28, k:130, categoria:'Cereales'},
  {nombre: 'Pasta cocida', g:1, p:5,  c:31, k:157, categoria:'Cereales'},
  {nombre: 'Tortilla de maíz', g:1, p:2,  c:17, k:92, categoria:'Cereales'},
  {nombre: 'Pan blanco', g:1, p:3,  c:13, k:74, categoria:'Cereales'},
  {nombre: 'Avena', g:7,  p:13, c:68, k:389, categoria:'Cereales'},
  {nombre: 'Pan integral', g:2,p:5,  c:13, k:69, categoria:'Cereales'},
  // NUEVO
  {nombre: 'Pan integral 12 granos', g:4.71, p:11.76, c:49.41, k:287, categoria:'Cereales'},

  // Proteínas animales
  {nombre: 'Huevo', g:11, p:13, c:1,  k:155, categoria:'Proteínas'},
  {nombre: 'Pechuga de pollo', g:3, p:31, c:0,  k:165, categoria:'Proteínas'},
  {nombre: 'Carne molida', g:20, p:26, c:0, k:290, categoria:'Proteínas'},
  {nombre: 'Atún en agua', g:1, p:23, c:0,  k:109, categoria:'Proteínas'},
  {nombre: 'Salchicha', g:27, p:12, c:1, k:301, categoria:'Proteínas'},
  // NUEVO
  {nombre: 'Whey protein', g:6.25, p:75, c:9.38, k:394, categoria:'Proteínas'},

  // Lácteos
  {nombre: 'Leche entera', g:3, p:3,  c:5,  k:61, categoria:'Lácteos'},
  {nombre: 'Yogur natural', g:5, p:3,  c:7,  k:79, categoria:'Lácteos'},
  {nombre: 'Queso panela', g:15,p:18, c:2,  k:255, categoria:'Lácteos'},
  {nombre: 'Queso cheddar', g:33,p:25, c:1,  k:403, categoria:'Lácteos'},
  {nombre: 'Crema ácida', g:20,p:2,  c:3,  k:193, categoria:'Lácteos'},
  // NUEVO
  {nombre: 'Leche deslact +prot', g:2, p:5.4, c:3.36, k:53, categoria:'Lácteos'},

  // Leguminosas / vegetales proteicos
  {nombre: 'Frijoles', g:1,  p:9,  c:27, k:155, categoria:'Leguminosas'},
  {nombre: 'Garbanzos', g:6,  p:19, c:61, k:364, categoria:'Leguminosas'},
  {nombre: 'Lentejas', g:1,  p:9,  c:20, k:116, categoria:'Leguminosas'},
  {nombre: 'Tofu', g:4,  p:8,  c:2,  k:76, categoria:'Leguminosas'},
  {nombre: 'Hummus', g:14, p:8,  c:14, k:237, categoria:'Leguminosas'},

  // Grasas y semillas
  {nombre: 'Aguacate', g:15,p:2,  c:9,  k:160, categoria:'Grasas'},
  {nombre: 'Nuez', g:65,p:15, c:14, k:654, categoria:'Grasas'},
  {nombre: 'Almendra', g:50,p:21, c:22, k:579, categoria:'Grasas'},
  {nombre: 'Cacahuate', g:49,p:26, c:16, k:567, categoria:'Grasas'},
  {nombre: 'Semilla de girasol', g:51,p:21, c:20, k:584, categoria:'Grasas'},
  {nombre: 'Aceite de oliva', g:100,p:0, c:0, k:884, categoria:'Grasas'},
  {nombre: 'Mantequilla', g:81,p:1,  c:1,  k:717, categoria:'Grasas'},
  {nombre: 'Mayonesa', g:75,p:1,  c:0,  k:680, categoria:'Grasas'},
  // NUEVOS
  {nombre: 'Crema cacahuate s/a', g:55, p:27, c:8, k:635, categoria:'Grasas'},
  {nombre: 'Crema avellana', g:37, p:4, c:55, k:570, categoria:'Grasas'},

  // Verduras
  {nombre: 'Papa cocida', g:0,  p:2,  c:17, k:87, categoria:'Verduras'},
  {nombre: 'Camote', g:0,  p:2,  c:20, k:86, categoria:'Verduras'},
  {nombre: 'Zanahoria', g:0,  p:1,  c:10, k:41, categoria:'Verduras'},
  {nombre: 'Brócoli', g:0,  p:3,  c:7,  k:34, categoria:'Verduras'},
  {nombre: 'Lechuga', g:0,  p:1,  c:2,  k:15, categoria:'Verduras'},

  // Salsas y añadidos
  {nombre: 'Salsa catsup', g:0, p:1,  c:26, k:112, categoria:'Salsas'},
  {nombre: 'Miel', g:0,  p:0,  c:82, k:304, categoria:'Salsas'},

  // Procesados / panadería
  {nombre: 'Cereal Corn Flakes', g:0,p:7,  c:84, k:357, categoria:'Procesados'},
  {nombre: 'Granola', g:10,p:10, c:65, k:450, categoria:'Procesados'},
  {nombre: 'Galletas María', g:12,p:6, c:70, k:430, categoria:'Procesados'},
  {nombre: 'Croissant', g:20,p:8, c:45, k:406, categoria:'Procesados'},

  // Comida rápida / platillos
  {nombre: 'Pizza', g:11,p:12, c:35, k:266, categoria:'Platillos'},
  {nombre: 'Hamburguesa', g:14,p:17, c:30, k:295, categoria:'Platillos'},
  {nombre: 'Hotdog', g:15,p:11, c:23, k:290, categoria:'Platillos'},
  {nombre: 'Tacos al pastor', g:10,p:14, c:12, k:210, categoria:'Platillos'},
  {nombre: 'Enchiladas', g:8,p:10, c:20, k:190, categoria:'Platillos'}

];

    const categoriasPredefinidas = [
      'Todos',
      'Frutas',
      'Verduras',
      'Cereales',
      'Proteínas',
      'Lácteos',
      'Leguminosas',
      'Grasas',
      'Salsas',
      'Procesados',
      'Platillos'
    ];

    // Construye los "chips" de categoría
    function construirChips(){
      const cont = document.getElementById('chipsCategorias');
      cont.innerHTML = '';

      categoriasPredefinidas.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (cat === categoriaActiva ? ' activo' : '');
        btn.textContent = cat;
        btn.onclick = () => {
          categoriaActiva = cat;
          construirChips();
          construirLista();
        };
        cont.appendChild(btn);
      });
    }

    // Construye la lista de alimentos en función de los filtros
    function construirLista(){
      const cont = document.getElementById('lista');
      cont.innerHTML = '';

      const texto = textoBusqueda.trim().toLowerCase();

      const filtrados = ALIMENTOS.filter(item => {
        const coincideTexto = item.nombre.toLowerCase().includes(texto);
        const coincideCategoria = 
          (categoriaActiva === 'Todos') || 
          (item.categoria === categoriaActiva);
        return coincideTexto && coincideCategoria;
      });

      if(filtrados.length === 0){
        const vacio = document.createElement('p');
        vacio.textContent = 'No se encontraron alimentos con esos filtros.';
        vacio.style.fontSize = '0.9rem';
        vacio.style.color = '#6b7280';
        cont.appendChild(vacio);
        return;
      }

      filtrados.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'btnAlimento';
        btn.type = 'button';
        btn.onclick = () => enviar(item);

        const info = document.createElement('div');
        info.className = 'alimento-info';

        const nombre = document.createElement('div');
        nombre.className = 'alimento-nombre';
        nombre.textContent = item.nombre;

        const detalle = document.createElement('div');
        detalle.className = 'alimento-detalle';
        detalle.textContent = `Por 100 g · ${item.k} kcal`;

        info.appendChild(nombre);
        info.appendChild(detalle);

        const macro = document.createElement('div');
        macro.className = 'alimento-macro';
        macro.textContent = 
          `P: ${item.p} g · G: ${item.g} g · C: ${item.c} g`;

        btn.appendChild(info);
        btn.appendChild(macro);

        cont.appendChild(btn);
      });
    }

    // Envía datos al servidor
    function enviar(item){
      const url =
        `/setAlimento?nombre=${encodeURIComponent(item.nombre)}`+
        `&g=${item.g}&p=${item.p}&c=${item.c}&k=${item.k}`;

      fetch(url)
        .then(() => window.location.href = '/LEDsPage')
        .catch(() => alert("No se pudo enviar el alimento al ESP"));
    }

    // Inicialización
    window.addEventListener('load', () => {
      // Buscador
      const input = document.getElementById('busqueda');
      input.addEventListener('input', (e) => {
        textoBusqueda = e.target.value;
        construirLista();
      });

      construirChips();
      construirLista();
    });
  </script>
</body>
</html>
